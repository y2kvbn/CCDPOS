<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>寵芯訂POS系統</title>
<link rel="stylesheet" href="css/style.css?v=29">
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">🐾</div>
      <div>
        <div class="name" id="store-name-label">寵芯訂POS系統</div>
        <div class="sub">管理後台</div>
      </div>
    </div>
    <nav class="nav" id="nav">
      <div class="nav-item" data-view="dashboard"><span class="icon">📊</span>營運總覽</div>
      <div class="nav-item" data-view="pos"><span class="icon">🧾</span>POS 收銀</div>
      <div class="nav-item" data-view="reservations"><span class="icon">✂️</span>訂單管理</div>
      <div class="nav-item" data-view="members"><span class="icon">👤</span>會員管理</div>
      <div class="nav-item" data-view="courses"><span class="icon">🎓</span>美容教學課程</div>
      <div class="nav-item" data-view="orders"><span class="icon">📜</span>交易紀錄查詢</div>
      <div class="nav-item" data-view="products"><span class="icon">📦</span>商品管理</div>
      <div class="nav-item" data-view="purchasing"><span class="icon">🚚</span>進貨管理</div>
      <div class="nav-item" data-view="inventory"><span class="icon">🏷️</span>庫存管理</div>
      <div class="nav-item" data-view="reports"><span class="icon">📈</span>報表</div>
      <div class="nav-item" data-view="settings"><span class="icon">⚙️</span>設定</div>
    </nav>
    <div class="sidebar-foot">
      <div class="store-user">目前操作者</div>
      <select id="operator-select" style="width:100%;margin:4px 0 6px;"></select>
      <div id="sidebar-date"></div>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <h1 id="view-title">營運總覽</h1>
      <div class="topbar-right">
        <span class="clock" id="clock"></span>
        <button class="btn sm" id="btn-reset-data" title="重置示範資料">重置示範資料</button>
      </div>
    </div>

    <!-- 營運總覽 -->
    <div class="view" id="view-dashboard"></div>

    <!-- POS 收銀 -->
    <div class="view" id="view-pos" hidden></div>

    <!-- 訂單管理（美容/寄養/安親） -->
    <div class="view" id="view-reservations" hidden></div>

    <!-- 會員管理 -->
    <div class="view" id="view-members" hidden></div>

    <!-- 美容教學課程 -->
    <div class="view" id="view-courses" hidden></div>

    <!-- 交易紀錄查詢 -->
    <div class="view" id="view-orders" hidden></div>

    <!-- 商品管理 -->
    <div class="view" id="view-products" hidden></div>

    <!-- 進貨管理 -->
    <div class="view" id="view-purchasing" hidden></div>

    <!-- 庫存管理 -->
    <div class="view" id="view-inventory" hidden></div>

    <!-- 報表 -->
    <div class="view" id="view-reports" hidden></div>

    <!-- 設定 -->
    <div class="view" id="view-settings" hidden></div>
  </div>
</div>

<div id="modal-backdrop">
  <div id="modal-box"></div>
</div>
<div id="toast"></div>
<div id="print-area"></div>

<script src="js/db.js?v=29"></script>
<script src="js/utils.js?v=29"></script>
<script src="js/dashboard.js?v=29"></script>
<script src="js/pos.js?v=29"></script>
<script src="js/reservations.js?v=29"></script>
<script src="js/members.js?v=29"></script>
<script src="js/courses.js?v=29"></script>
<script src="js/orders.js?v=29"></script>
<script src="js/products.js?v=29"></script>
<script src="js/purchasing.js?v=29"></script>
<script src="js/inventory.js?v=29"></script>
<script src="js/reports.js?v=29"></script>
<script src="js/settings.js?v=29"></script>
<script src="js/main.js?v=29"></script>
</body>
</html>
